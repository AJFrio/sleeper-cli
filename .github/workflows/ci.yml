name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is a declared engine requirement, so a release must work there.
        # 22.12 is the floor because vitest 5 declares engines
        # `^22.12.0 || ^24.0.0 || >=26.0.0`; the suite cannot run on Node 20, which
        # has also been end-of-life since 2026-04-30.
        node: ['22.12', '24', '25', '26']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The suite is fully offline: both clients accept an injected fetch, so no
      # credential is needed and no request reaches Sleeper.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test the built binary
        run: |
          node dist/index.js --version
          node dist/index.js --help > /dev/null
          node dist/index.js config paths --table

  publish:
    # Publishing is a manual step: this job only checks the build is publishable, and
    # requires the 2FA-protected token. It is deliberately not wired to a release event.
    if: false
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
